name: Unit Test
on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # No need to download artifact - use input directly
      - name: Use image tag
        id: read-tag
        run: |
          IMAGE_TAG="${{ inputs.image-tag }}"
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $IMAGE_TAG"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Pull and test Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_PROD: nebo_task
          ECR_REPOSITORY_STAGE: nebo_task_stage
          IMAGE_TAG: ${{ steps.read-tag.outputs.tag }}
        run: |
          #!/bin/bash
          echo "Using image tag: $IMAGE_TAG"
          echo "ECR Registry: $ECR_REGISTRY"
          echo "ECR Repository Stage: $ECR_REPOSITORY_STAGE"
          
          # Construct full image reference
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$IMAGE_TAG"
          echo "Full image reference: $FULL_IMAGE"
          
          # Pull the image
          docker pull "$FULL_IMAGE"
          
          echo "Running Python unit tests..."
          docker run --rm "$FULL_IMAGE" python3 /usr/local/bin/math_test.py
          python_exit_code=$?
          
          if [ $python_exit_code -ne 0 ]; then
            echo "ERROR: Python tests failed with exit code $python_exit_code"
            exit $python_exit_code
          else
            echo "SUCCESS: Python tests passed"
          fi
          
          echo "Starting container for HTTP tests..."
          docker run -d \
            --name temp-name-container \
            -p 8080:80 \
            "$FULL_IMAGE"
          
          sleep 5
          
          curl --fail http://localhost:8080
          curl_exit_code=$?
          
          if [ $exit_status -ne 0 ]; then
            echo "Curl command failed with exit code $exit_status"
            docker logs temp-name-container
            docker stop temp-name-container
            docker rm temp-name-container
            proceed_with_push="false"
          else
            echo "Curl command succeeded"
            docker stop temp-name-container
            docker rm temp-name-container
          fi

          if [ "$proceed_with_push" = "false" ]; then
            echo "Test failed, exiting...."
            exit $exit_status
          fi
 
  deploy-stage:
    needs: test
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy_ecs.yml
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
      ecr-repository: 'nebo_task_stage'
      service-name: 'nebo-service-stage'
    secrets: inherit
          
