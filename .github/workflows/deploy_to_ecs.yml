name: Deploy to ECS Stage

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
      ecr-repository:
        required: false
        type: string
        default: 'nebo_task_stage'
      service-name:
        required: false
        type: string
        default: 'nebo-service-stage'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ inputs.service-name }} \
            --query 'taskDefinition' \
            --output json > task-definition.json
      
      - name: Update image in task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          # Clean and update task definition
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
              .containerDefinitions[0].image = "'$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG'"' \
              task-definition.json > new-task-definition.json
      
      - name: Register and deploy new task definition
        run: |
          # Register new revision
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.revision' \
            --output text)
          
          echo "New revision: $REVISION"
          
          # Update service
          aws ecs update-service \
            --cluster nebo-ecs-stage \
            --service ${{ inputs.service-name }} \
            --task-definition ${{ inputs.service-name }}:$REVISION \
            --force-new-deployment
          
          # Wait for stability
          echo "Waiting for deployment..."
          aws ecs wait services-stable \
            --cluster nebo-ecs-stage \
            --services ${{ inputs.service-name }}
          
          echo "✅ Deployed ${{ inputs.ecr-repository }}:${{ inputs.image-tag }}"
