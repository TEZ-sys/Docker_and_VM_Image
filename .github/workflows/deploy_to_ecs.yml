name: Deploy to ECS Prod

on:
  workflow_call:
    inputs:
      aws-role-arn:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: 'eu-west-2'
      image-tag:
        required: true
        type: string
      ecr-repository:
        required: false
        type: string
        default: 'nebo_task'
      service-name:
        required: false
        type: string
        default: 'nebo-service-prod'


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@3f884f8c7f7c69c71ca2f45e26e9af35b4e14e3c
      
      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ inputs.service-name }} \
            --query 'taskDefinition' \
            --output json > task-definition.json
      
      - name: Update image in task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
              .containerDefinitions[0].image = "'$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG'"' \
              task-definition.json > new-task-definition.json
      
      - name: Register new task definition
        id: register
        run: |
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.revision' \
            --output text)
          
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "New revision: $REVISION"
      
      - name: Check service status
        id: check-service
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster nebo-ecs-prod \
            --services ${{ inputs.service-name }} \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "NONE")
          
          echo "status=$SERVICE_STATUS" >> $GITHUB_OUTPUT
          echo "Service status: $SERVICE_STATUS"
          
          if [ "$SERVICE_STATUS" == "ACTIVE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "needs_create=false" >> $GITHUB_OUTPUT
          elif [ "$SERVICE_STATUS" == "NONE" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "needs_create=true" >> $GITHUB_OUTPUT
          else
            # Service exists but not ACTIVE (DRAINING, INACTIVE, etc.)
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "needs_create=true" >> $GITHUB_OUTPUT
            echo "⚠️  Service exists but is $SERVICE_STATUS - will delete and recreate"
          fi
      
      - name: Delete inactive service
        if: steps.check-service.outputs.exists == 'true' && steps.check-service.outputs.needs_create == 'true'
        run: |
          echo "Deleting inactive service..."
          aws ecs delete-service \
            --cluster nebo-ecs-prod \
            --service ${{ inputs.service-name }} \
            --force || true
          
          echo "Waiting for service deletion..."
          sleep 10
      
      - name: Get VPC info (only if creating service)
        if: steps.check-service.outputs.needs_create == 'true'
        id: vpc-info
        run: |
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')
          SG_ID=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=default" --query 'SecurityGroups[0].GroupId' --output text)
          
          echo "subnets=$SUBNETS" >> $GITHUB_OUTPUT
          echo "security_group=$SG_ID" >> $GITHUB_OUTPUT
      
      - name: Create service
        if: steps.check-service.outputs.needs_create == 'true'
        run: |
          echo "Creating service..."
          aws ecs create-service \
            --cluster nebo-ecs-prod \
            --service-name ${{ inputs.service-name }} \
            --task-definition ${{ inputs.service-name }}:${{ steps.register.outputs.revision }} \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.vpc-info.outputs.subnets }}],securityGroups=[${{ steps.vpc-info.outputs.security_group }}],assignPublicIp=ENABLED}"
      
      - name: Update service
        if: steps.check-service.outputs.exists == 'true' && steps.check-service.outputs.needs_create == 'false'
        run: |
          echo "Updating existing service..."
          aws ecs update-service \
            --cluster nebo-ecs-prod \
            --service ${{ inputs.service-name }} \
            --task-definition ${{ inputs.service-name }}:${{ steps.register.outputs.revision }} \
            --force-new-deployment
      
      - name: Wait for service stability
        run: |
          echo "Waiting for deployment to complete..."
          aws ecs wait services-stable \
            --cluster nebo-ecs-prod \
            --services ${{ inputs.service-name }}
          
          echo "✅ Deployed ${{ inputs.ecr-repository }}:${{ inputs.image-tag }} to production"
