name: Deploy to ECS Stage

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
      ecr-repository:
        required: false
        type: string
        default: 'nebo_task_stage'
      service-name:
        required: false
        type: string
        default: 'nebo-service-stage'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ inputs.service-name }} \
            --query 'taskDefinition' \
            --output json > task-definition.json
      
      - name: Update image in task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          # Clean and update task definition
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
              .containerDefinitions[0].image = "'$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG'"' \
              task-definition.json > new-task-definition.json
      
      - name: Register new task definition
        id: register
        run: |
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.revision' \
            --output text)
          
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "New revision: $REVISION"
      
      - name: Check if service exists
        id: check-service
        run: |
          if aws ecs describe-services \
            --cluster nebo-ecs-stage \
            --services ${{ inputs.service-name }} \
            --query 'services[0].status' \
            --output text 2>/dev/null | grep -q "ACTIVE"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Get VPC info (only if service doesn't exist)
        if: steps.check-service.outputs.exists == 'false'
        id: vpc-info
        run: |
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')
          SG_ID=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=default" --query 'SecurityGroups[0].GroupId' --output text)
          
          echo "subnets=$SUBNETS" >> $GITHUB_OUTPUT
          echo "security_group=$SG_ID" >> $GITHUB_OUTPUT
      
      - name: Create service (first deployment)
        if: steps.check-service.outputs.exists == 'false'
        run: |
          echo "Creating new service..."
          aws ecs create-service \
            --cluster nebo-ecs-stage \
            --service-name ${{ inputs.service-name }} \
            --task-definition ${{ inputs.service-name }}:${{ steps.register.outputs.revision }} \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.vpc-info.outputs.subnets }}],securityGroups=[${{ steps.vpc-info.outputs.security_group }}],assignPublicIp=ENABLED}"
      
      - name: Update service (subsequent deployments)
        if: steps.check-service.outputs.exists == 'true'
        run: |
          echo "Updating existing service..."
          aws ecs update-service \
            --cluster nebo-ecs-stage \
            --service ${{ inputs.service-name }} \
            --task-definition ${{ inputs.service-name }}:${{ steps.register.outputs.revision }} \
            --force-new-deployment
      
      - name: Wait for service stability
        run: |
          echo "Waiting for deployment to complete..."
          aws ecs wait services-stable \
            --cluster nebo-ecs-stage \
            --services ${{ inputs.service-name }}
          
          echo "✅ Deployed ${{ inputs.ecr-repository }}:${{ inputs.image-tag }}"
