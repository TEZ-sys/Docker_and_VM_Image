name: Docker Image CI
on:
  push:
    branches: [ "Stage" ]
  pull_request:
    branches: [ "Stage" ]
  
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.deploy.outputs.image-tag }}
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Get latest image from ECR
        id: get-image
        env:
          ECR_REPOSITORY_STAGE: nebo_task_stage
        run: |
          LATEST_TAG=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY_STAGE \
            --output json | \
            jq -r '.imageDetails | 
              map(select(.imageTags != null)) | 
              map(select(.imageTags[] | startswith("dev_"))) | 
              sort_by(.imagePushedAt) | 
              last | 
              .imageTags[] | 
              select(startswith("dev_"))' || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: No dev_ image found in ECR"
            exit 1
          fi
          
          echo "Latest image tag: $LATEST_TAG"
          echo "image-tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
      - name: Deploy
        id: deploy
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_STAGE: nebo_task_stage
        run: |
          LATEST_TAG="${{ steps.get-image.outputs.image-tag }}"
          
          echo "Pulling image: $ECR_REGISTRY/$ECR_REPOSITORY_STAGE:${LATEST_TAG}"
          docker pull "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:${LATEST_TAG}"
          
          NEW_TAG="${LATEST_TAG/dev_/stage_}"
          
          echo "Creating new tag: $NEW_TAG"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:${LATEST_TAG}" "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$NEW_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$NEW_TAG"
          
          echo "Successfully pushed: $NEW_TAG"
          echo "image-tag=$NEW_TAG" >> $GITHUB_OUTPUT
  
  test:
    needs: build
    uses: ./.github/workflows/unit_test.yml
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
    secrets: inherit
