name: Docker Image CI
on:
  push:
    branches: [ "stage" ]
  pull_request:
    branches: [ "stage" ]
  
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-output.outputs.image-tag }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
          
      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_STAGE: nebo_task_stage
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
      - name: Get latest image from ECR
        id: get-image
        run: |
          # Get the most recently pushed image
          LATEST_TAG=$(aws ecr describe-images \
          --repository-name $ECR_REPOSITORY_STAGE \
          --query "sort_by(imageDetails[?contains(imageTags, 'dev_')], &imagePushedAt)[-1].imageTags[?starts_with(@, 'dev_')] | [0]" \
          --output text)
          
          echo "Latest image tag: $LATEST_TAG"
          echo "image-tag=$LATEST_TAG" >> $GITHUB_OUTPUT
      - name: Deploy
        run: |
          LATEST_TAG=${{ steps.get-image.outputs.image-tag }}
          docker pull "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:${LATEST_TAG}"
          NEW_TAG="${LATEST_TAG/dev/stage}"
          
          docker tag "$NEW_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$NEW_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$NEW_TAG"

          # Set output for next job/workflow
          echo "image-tag=$NEW_TAG" >> $GITHUB_OUTPUT
      
      - name: Set job output
        id: set-output
        run: |
          echo "image-tag=${{ steps.build.outputs.image-tag }}" >> $GITHUB_OUTPUT
      
      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt

  # Call test workflow directly instead of workflow_run
  test:
    needs: build
    uses: ./.github/workflows/unit_test.yml
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
    secrets: inherit
          
          
