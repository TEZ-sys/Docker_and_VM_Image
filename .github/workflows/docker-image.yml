name: Docker Image CI

on:
  push:
    branches: [ "main", "stage", "dev-*" ]
  pull_request:
    branches: [ "main", "stage", "dev-*" ]
  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_PROD: nebo_task
          ECR_REPOSITORY_STAGE: nebo_task_stage
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Sanitize branch name (replace / with -)
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          
          IMAGE_TAG=docker_image_${SAFE_BRANCH}_${RUN_NUMBER}_${RUN_ID}
          echo "Using tag: $IMAGE_TAG"
          
          # Force unique digest using a build ID
          BUILD_ID="${RUN_ID}-$(date +%s)"
          echo "Build ID: $BUILD_ID"
          
          # Build the image with a unique digest ARG (optional metadata)
          docker build \
            --build-arg BUILD_ID="$BUILD_ID" \
            -t "$IMAGE_TAG" \
            .
          
          if [ "$SAFE_BRANCH" = "stage" ]; then
            docker tag "$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$IMAGE_TAG"
          fi
          
      - name: Save image tag to artifact
        run: |
          echo "$IMAGE_TAG" > image_tag.txt
      
      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt
          
          
