name: Docker Image CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-output.outputs.image-tag }}
      
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
          
      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_STAGE: nebo_task_stage
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=stage_${RUN_NUMBER}_${{ github.sha }}
          
          echo "Using tag: $IMAGE_TAG"
          
          docker build -t "$IMAGE_TAG" .
          
          docker tag "$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$IMAGE_TAG"
          
          # Set output for next job/workflow
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          
          # Also save to artifact as backup
          echo "$IMAGE_TAG" > image_tag.txt
      
      - name: Set job output
        id: set-output
        run: |
          echo "image-tag=${{ steps.build.outputs.image-tag }}" >> $GITHUB_OUTPUT
      
      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt

  # Call test workflow directly instead of workflow_run
  test:
    needs: build
    uses: ./.github/workflows/unit_test.yml
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
    secrets: inherit
          
          
