name: Docker Image CI
on:
  push:
    branches: [ "dev-*" ]
  pull_request:
    branches: [ "dev-*" ]
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.set-output.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::640786919619:role/Github-Ci-CD
          aws-region: eu-west-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_REPOSITORY_STAGE: nebo_task_stage
          
        run: |
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=dev_${RUN_NUMBER}_${{ github.sha }}
          echo "Using tag: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          
          echo "Latest image tag: $LATEST_TAG"
          echo "image-tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          docker tag "$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_STAGE:$IMAGE_TAG"
          
          # Set output for next job/workflow
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

          # Also save to artifact as backup
          echo "$IMAGE_TAG" > image_tag.txt
      
      - name: Set job output
        id: set-output
        run: |
          echo "image-tag=${{ steps.build.outputs.image-tag }}" >> $GITHUB_OUTPUT
      
      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt
  
  test:
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/unit_test.yml
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
      aws-role-arn: arn:aws:iam::640786919619:role/Github-Ci-CD
    secrets: inherit
#
